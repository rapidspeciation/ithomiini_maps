name: Update Database

on:
  # Manual trigger from Actions tab or via API
  workflow_dispatch:
    inputs:
      update_sanger:
        description: 'Update Sanger Institute data'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      update_gbif:
        description: 'Update GBIF/iNaturalist data (takes ~15 min)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # GBIF download (~25min) + processing + curation

    permissions:
      contents: write  # Needed to commit changes
      actions: write  # Needed to start the site's publishing once the data is committed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: |
            public/data/gbif_occurrences.json
            public/data/gbif_taxon_keys.json
            public/data/sanger_taxonomy.csv
          key: pipeline-cache-${{ hashFiles('scripts/gbif_download_api.py', 'scripts/process_data.py') }}
          restore-keys: |
            pipeline-cache-

      - name: Restore taxonomy cache
        uses: actions/cache@v4
        with:
          path: public/data/gbif_taxonomy_cache.json
          key: taxonomy-cache-${{ github.run_id }}
          restore-keys: |
            taxonomy-cache-

      - name: Update GBIF data (if requested)
        if: ${{ inputs.update_gbif == 'true' }}
        run: |
          echo "🌐 Downloading fresh GBIF/iNaturalist data..."
          python scripts/gbif_download_api.py
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}

      - name: Run data processing pipeline
        run: |
          echo "📊 Processing data from all sources..."
          python scripts/process_data.py
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}

      - name: Run taxonomic curation
        run: |
          echo "🔬 Running taxonomic curation pipeline..."
          python scripts/taxonomic_curation.py --apply

      - name: Fetch GoaT genomic data
        run: |
          echo "🧬 Fetching GoaT (Genomes on a Tree) data..."
          python scripts/fetch_goat_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s public/data) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add -f public/data/map_points_*.json public/data/data_manifest.json public/data/gbif_citation.json public/data/taxonomic_corrections_applied.json public/data/taxonomic_curation_report.json public/data/goat_lepidoptera.json
          git commit -m "🔄 Auto-update database from Google Sheets/GBIF

          Triggered by: ${{ github.actor }}
          Workflow run: ${{ github.run_id }}"

          git push

      # A push made with the workflow's own token starts no other workflow: the site is published here.
      - name: Publish the site
        if: steps.check_changes.outputs.changes == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Report no changes
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "✅ No changes detected in data files."
          echo "The database is already up to date."
